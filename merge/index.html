<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合并 PDF · 免费在线工具（文件不上传）| 文火工具箱</title>
<meta name="description" content="把多个 PDF 合并成一个，可自由排序。全程在浏览器本地完成，文件不上传服务器。">
<link rel="canonical" href="https://wenhuo.top/merge/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="文火工具箱">
<meta property="og:title" content="合并 PDF · 文件不上传服务器">
<meta property="og:description" content="多个 PDF 合成一个，顺序可调。全程在你自己的浏览器里完成，文件不上传。">
<meta property="og:url" content="https://wenhuo.top/merge/">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="/assets/common.css">
<script src="/assets/vendor/pdf-lib.min.js"></script>
</head>
<body>
<div class="topbar"><a href="/"><svg class="i"><use href="/assets/icons.svg#arrow-left"></use></svg> 返回文火工具箱</a></div>
<div class="wrap">

  <header>
    <h1>合并 PDF</h1>
    <p class="sub">把多个 PDF 按你指定的顺序合成一个。文件不上传，全部在本机完成。</p>
    <div class="badges">
      <span class="badge"><svg class="i"><use href="/assets/icons.svg#lock"></use></svg> 文件不上传</span>
      <span class="badge"><svg class="i"><use href="/assets/icons.svg#check"></use></svg> 零质量损失</span>
      <span class="badge"><svg class="i"><use href="/assets/icons.svg#infinity"></use></svg> 不限数量</span>
    </div>
  </header>

  <div class="card">
    <div class="drop" id="drop">
      <div class="ico"><svg class="i"><use href="/assets/icons.svg#arrows-join"></use></svg></div>
      <div class="t">点击选择，或把多个 PDF 拖到这里</div>
      <div class="h">可以分几次添加，加完再排序；至少需要 2 个文件</div>
    </div>
    <input type="file" id="file" accept=".pdf,application/pdf" multiple>

    <ul class="flist" id="list"></ul>

    <div class="row">
      <button id="btnGo" class="btn-p" disabled><svg class="i"><use href="/assets/icons.svg#arrows-join"></use></svg> 合并并下载</button>
      <button id="btnSortName" class="btn-s" disabled>按文件名排序</button>
      <button id="btnClear" class="btn-s" disabled>清空</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <div class="card tips">
    <b>说明</b>
    <ul>
      <li>合并是页面级操作，<b>不会重新压缩或重排内容</b>，页面、文字、图片和原文件完全一致。</li>
      <li>书签、表单域、注释在合并后可能丢失，正文内容不受影响。</li>
      <li>加密（设了打开密码）的 PDF 无法处理，请先用原软件取消密码。</li>
      <li>文件很大或很多时，浏览器需要一些时间和内存，请耐心等待不要关页面。</li>
    </ul>
  </div>

</div>

<script src="/assets/common.js"></script>
<script>
(function(){
  const { $, fmtSize, download, setupDrop, statusOf, baseName } = W;
  const listEl = $('#list'), btnGo = $('#btnGo'), btnClear = $('#btnClear'), btnSortName = $('#btnSortName');
  const say = statusOf($('#status'));

  let items = [];   // {file, pages, err}

  const refreshButtons = () => {
    const usable = items.filter(i => !i.err).length;
    btnGo.disabled = usable < 2;
    btnClear.disabled = items.length === 0;
    btnSortName.disabled = items.length < 2;
  };

  function render(){
    listEl.innerHTML = '';
    items.forEach((it, i) => {
      const li = document.createElement('li');
      const meta = it.err ? `<span class="meta" style="color:var(--err)">${it.err}</span>`
                          : `<span class="meta">${it.pages} 页 · ${fmtSize(it.file.size)}</span>`;
      li.innerHTML =
        `<span class="idx">${i + 1}</span>` +
        `<span class="nm" title="${it.file.name}">${it.file.name}</span>` +
        meta +
        `<button class="btn-mini" data-act="up" ${i === 0 ? 'disabled' : ''}>↑</button>` +
        `<button class="btn-mini" data-act="down" ${i === items.length - 1 ? 'disabled' : ''}>↓</button>` +
        `<button class="btn-mini" data-act="del"></button>`;
      li.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        const act = b.dataset.act;
        if (act === 'del') items.splice(i, 1);
        else if (act === 'up') [items[i - 1], items[i]] = [items[i], items[i - 1]];
        else [items[i + 1], items[i]] = [items[i], items[i + 1]];
        render(); refreshButtons();
      }));
      listEl.appendChild(li);
    });
  }

  async function addFiles(files){
    const pdfs = files.filter(f => /\.pdf$/i.test(f.name));
    const skipped = files.length - pdfs.length;
    if (!pdfs.length) return say('没有可用的 PDF 文件，只支持 .pdf 格式。', 's-err');

    say('正在读取文件…', 's-run');
    for (const f of pdfs) {
      let pages = 0, err = null;
      try {
        const doc = await PDFLib.PDFDocument.load(await f.arrayBuffer(), { ignoreEncryption: true });
        pages = doc.getPageCount();
      } catch (e) {
        err = '无法读取（可能已加密或文件损坏）';
      }
      items.push({ file: f, pages, err });
    }
    render(); refreshButtons();
    const bad = items.filter(i => i.err).length;
    say(`已添加 ${pdfs.length} 个文件，共 ${items.length} 个` +
        (skipped ? `（忽略了 ${skipped} 个非 PDF 文件）` : '') +
        (bad ? `，其中 ${bad} 个无法读取` : ''), bad ? 's-err' : 's-ok');
  }

  setupDrop($('#drop'), $('#file'), addFiles);

  btnSortName.addEventListener('click', () => {
    items.sort((a, b) => a.file.name.localeCompare(b.file.name, 'zh-CN', { numeric: true }));
    render(); refreshButtons();
    say('已按文件名排序', 's-ok');
  });

  btnClear.addEventListener('click', () => {
    items = []; $('#file').value = '';
    render(); refreshButtons(); say('');
  });

  btnGo.addEventListener('click', async () => {
    const usable = items.filter(i => !i.err);
    if (usable.length < 2) return;

    btnGo.disabled = true;
    say('正在合并…', 's-run');
    try {
      const out = await PDFLib.PDFDocument.create();
      let total = 0;
      for (const it of usable) {
        const src = await PDFLib.PDFDocument.load(await it.file.arrayBuffer(), { ignoreEncryption: true });
        const copied = await out.copyPages(src, src.getPageIndices());
        copied.forEach(p => out.addPage(p));
        total += copied.length;
      }
      const bytes = await out.save();
      const name = baseName(usable[0].file.name) + '_等' + usable.length + '个文件_合并.pdf';
      download(new Blob([bytes], { type: 'application/pdf' }), name);
      say(`合并完成，共 ${total} 页，已开始下载`, 's-ok');
    } catch (e) {
      console.error(e);
      say('合并失败：' + (e && e.message ? e.message : '未知错误'), 's-err');
    }
    btnGo.disabled = false;
  });

  W.mountFooter(document.querySelector('.wrap'));
})();
</script>
<script>W.mountPdfSwitch('merge');</script>
</body>
</html>
